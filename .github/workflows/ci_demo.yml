name: CI — Demo Mode

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/ -v

      - name: Test CLI help
        run: python -m uepi_runner.cli --help

      - name: Test demo core loads
        run: |
          python -c "
          from uepi_runner.core_loader import load_core, is_verified_core
          core = load_core()
          print(f'Core: {core.version()}')
          print(f'Verified: {is_verified_core(core)}')
          assert not is_verified_core(core), 'Should be demo in CI'
          print('Demo core loaded successfully')
          "
